<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard | AI Governance</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <main class="page">

        <div class="dashboard-card">

            <div class="logo">AI</div>

            <h1>AI GOVERNANCE</h1>

            <h2>Student Dashboard</h2>

            <p class="welcome-message">
                Welcome,
                <strong>{{ email }}</strong>
            </p>

            <div class="dashboard-content">

                <div class="dashboard-item">
                    <h3>AI Policies</h3>
                    <p>
                        Review university AI governance policies.
                    </p>
                </div>

                <div class="dashboard-item">
                    <h3>Student Resources</h3>
                    <p>
                        Access AI governance guidance and resources.
                    </p>
                </div>

                <div class="dashboard-item">
                    <h3>Responsible AI</h3>
                    <p>
                        Learn about responsible and ethical AI use.
                    </p>
                </div>

            </div>

            <a
                class="logout-button"
                href="{{ url_for('logout') }}"
            >
                Logout
            </a>

        </div>

    </main>

</body>

</html>
